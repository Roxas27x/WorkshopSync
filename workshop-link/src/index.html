<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.steamusercontent.com https://*.steamstatic.com https://*.akamaihd.net https://i.imgur.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>WorkshopSync</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app utility-app"><header class="utility-header"><div class="brand"><img class="sync-brand-icon" src="assets/workshopsync.png" alt=""><div>Workshop<span class="brand-sub">SYNC</span></div><span class="beta">BETA</span></div><div class="header-right"><span id="busy" class="quiet"></span><button id="friends-toggle" data-action="toggleFriends" aria-controls="friends-sidebar" aria-expanded="true">Friends <span id="friends-toggle-count">0</span></button><button id="stop-install" class="small" data-action="stopInstallBatch" title="Stops remaining install requests in this batch." hidden>Stop this batch</button><button id="connection-status" data-action="connectInfo">Connect Steam &amp; friends</button></div></header>
<div class="utility-body"><aside class="library-sidebar"><div class="games-heading"><span class="nav-label">YOUR GAMES</span><button class="icon-button" data-action="addGame" aria-label="Add game">+</button></div><div class="game-sort-control"><label class="sr-only" for="game-sort">Sort games</label><select id="game-sort" aria-label="Sort games"><option value="played">Latest played</option><option value="shared">Most shared items</option><option value="name">Name: A → Z</option></select></div><div class="game-list-heading"><span>Game</span><span>Auto-sync</span></div><div id="games"></div><section id="friends-sidebar" class="friends-sidebar" aria-label="Connected friends"></section><div class="aside-bottom"><button class="text-button" data-action="away">◷ &nbsp; While away <span id="away-count" class="count">0</span></button><button class="text-button" data-action="shareApp">↗ &nbsp; Share app</button><button class="text-button" data-action="settings">⚙ &nbsp; Settings</button></div></aside>
<div class="workspace"><div id="review-banner" class="update-banner" hidden></div><div id="update-banner" class="update-banner" role="status" hidden></div><main id="main"><p>Loading your library…</p></main><footer><span><i class="dot"></i> <span id="footer-status">Local lists · Synchronization off by default</span></span><button class="text-button" data-action="help">How it works ↗</button></footer></div></div></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="app-log.js"></script><script src="availability.js"></script><script src="mod-lists.js"></script><script src="auto-sync-blacklist.js"></script><script src="item-privacy.js"></script><script src="friend-items.js"></script><script src="game-library.js"></script><script src="companion-friends.js"></script><script src="themes.js"></script><script src="renderer-themes.js"></script><script src="renderer-sidebar.js"></script><script src="renderer-library.js"></script><script src="renderer-activity.js"></script><script src="renderer-connection.js"></script><script src="renderer-utility.js"></script><script src="renderer-friends.js"></script><script src="renderer-settings.js"></script><script src="renderer-lists.js"></script><script src="renderer-workshop.js"></script><script src="renderer-storage.js"></script><script src="renderer-install-review.js"></script><script src="renderer-details.js"></script><script src="renderer.js"></script></body></html>
